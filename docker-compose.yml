services:
  projects-service:
    build:
      context: ./projects-service
    image: abhijeetkumar51/portfolio-projects-service:latest
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped

  contact-service:
    build:
      context: ./contact-service
    image: abhijeetkumar51/portfolio-contact-service:latest
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: abhijeetkumar51/portfolio-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - projects-service
      - contact-service
    restart: unless-stopped
